name: ML Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libgl1 \
            libglib2.0-0 \
            libspatialindex-dev

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install PyTorch (CPU)
        run: |
          pip install torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          # Se estiver usando pyproject.toml (recomendado)
          # pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check src tests --output-format=github || true

      - name: Run tests
        run: |
          pytest tests/ -q --cov=src --cov-report=term-missing