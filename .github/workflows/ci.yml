name: ML Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev \
            libgl1 libglib2.0-0 libgomp1 \
            libspatialindex-dev libproj-dev \
            curl git

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install PyTorch (CPU)
        run: |
          pip install torch==2.4.1 torchvision==0.19.1 torchaudio==2.4.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-extra.txt ]; then
            pip install -r requirements-extra.txt
          fi

      - name: Install lint and test tools
        run: |
          pip install ruff==0.6.9 pytest-cov pytest-mock black isort

      - name: Lint with Ruff
        run: ruff check src tests --output-format=github

      - name: Format check (Black + isort)
        run: |
          black --check src tests
          isort --check-only src tests

      - name: Run Unit Tests
        run: pytest tests/unit/ -q --cov=src --cov-report=term-missing

      - name: Run Feature & Model Tests
        run: pytest tests/unit/features/ tests/unit/models/ tests/unit/ingestion/ -q --cov=src --cov-append

      - name: Run Integration Tests
        run: pytest tests/integration/ -q --cov=src --cov-append

      - name: Run Performance Tests (opcional)
        run: pytest tests/performance/ -q --cov=src --cov-append || echo "Performance tests skipped"

      - name: Upload coverage report
        if: github.repository == 'RodrigoDiasDeOliveira/Triminds-Geo-AI'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Summary
        if: always()
        run: echo "✅ CI finalizado - Unit, Integration e Features testados com sucesso!"