[project]
name = "satellite-land-classification"
version = "0.1.0"
description = "Land use and crop classification using satellite imagery"
authors = [
    { name = "Rodrigo Dias de Oliveira", email = "rodrigo.digau@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "timm",
    "albumentations",
    "numpy",
    "pandas",
    "scikit-learn",
    "opencv-python",
    "Pillow",
    "matplotlib",
    "seaborn",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "pyyaml",
    "hydra-core",
    "mlflow",
    "tensorboard",
    "fastapi",
    "uvicorn[standard]",
    "tqdm",
    "google-cloud-storage",
    "google-cloud-aiplatform",
    "google-cloud-bigquery",
    "pyspark",
    "dvc",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pre-commit",
    "isort",
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]
extend-ignore = ["E203", "W503"]

[tool.hydra]
run = { dir = "outputs/${now:%Y-%m-%d_%H-%M-%S}" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools]
package-dir = { "" = "src" }