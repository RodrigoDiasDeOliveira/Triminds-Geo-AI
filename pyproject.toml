[project]
name = "triminds-geo-ai"
version = "0.2.0"
description = "Enterprise Geospatial AI Platform - Multi-source Earth Observation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Rodrigo Dias de Oliveira", email = "rodrigo.digau@gmail.com" }
]

dependencies = [
    # Deep Learning
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",

    # Scientific Computing
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "psycopg2-binary =^2.9"

    # Geo
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",

    # APIs
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # MLOps
    "mlflow>=2.16",

    # Google Cloud
    "google-cloud-storage>=2.18",
    "google-cloud-aiplatform>=1.68",

    # Earth Engine
    "earthengine-api>=1.5",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",

    "ruff>=0.6",
    "black>=24.8",
    "isort>=5.13",

    "pre-commit>=3.8",

    "mypy>=1.11",
    "types-PyYAML",
]

big-data = [
    "pyspark>=3.5",
    "dvc>=3.55",
]

[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
extend-select = [
    "I",
    "B",
    "UP",
]

ignore = [
    "E203",
]

[tool.ruff.lint.per-file-ignores]
"src/deployment/api/main.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --cov=src --cov-report=term-missing"

markers = [
    "slow",
    "integration",
]