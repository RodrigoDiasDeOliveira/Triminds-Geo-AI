[project]
name = "satellite-land-classification"
version = "0.1.0"
description = "Land use and crop classification using satellite imagery"
authors = [
    { name = "Rodrigo Dias de Oliveira", email = "rodrigo.digau@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime dependencies.
dependencies = [
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "numpy>=1.26,<2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.6.9",
    "black==24.8.0",
    "isort==5.13.2",
    "pre-commit==3.8.0",
]

big-data = [
    "pyspark==3.5.2",
    "dvc==3.55.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# The project uses imports such as:
#
#     from src.models...
#
# Therefore "src" is part of the package name.
# Do NOT use package-dir = {"": "src"}.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"src/deployment/api/main.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]