[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",

    "black>=24.8",
    "ruff>=0.6",
    "isort>=5.13",

    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",

    "pre-commit>=3.8",
]

big-data = [
    "pyspark>=3.5",
    "dvc>=3.55",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

ignore = [
    "E203",
]

[tool.ruff.lint.per-file-ignores]
"src/deployment/api/main.py" = ["B008"]

