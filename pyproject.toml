[project]
name = "triminds-geo-ai"
version = "0.2.0"
description = "Enterprise Geospatial AI Platform - Multi-source Earth Observation"
authors = [
    { name = "Rodrigo Dias de Oliveira", email = "rodrigo.digau@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-storage>=2.18",
    "google-cloud-aiplatform>=1.68",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.6.9",
    "black==24.8.0",
    "isort==5.13.2",
    "pre-commit==3.8.0",
]

big-data = [
    "pyspark==3.5.2",
    "dvc==3.55.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"src/deployment/api/main.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"

markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
]