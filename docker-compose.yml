services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    profiles: ["mlflow"]
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri /mlruns --default-artifact-root /artifacts
    volumes:
      - ./mlruns:/mlruns
      - ./artifacts:/artifacts

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CONFIG_PATH: config/demo.yaml
      MODEL_REQUIRED: "true"
      MODEL_PATH: artifacts/best_model.pth
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./config:/app/config

  training:
    profiles: ["training"]
    build: .
    command: ["python", "-m", "src.pipelines.training_pipeline", "--config", "config/demo.yaml"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./config:/app/config
