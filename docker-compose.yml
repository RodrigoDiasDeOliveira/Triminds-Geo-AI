services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri /mlruns --default-artifact-root /artifacts
    volumes:
      - ./mlruns:/mlruns
      - ./artifacts:/artifacts

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_REQUIRED: "false"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./config:/app/config

  training:
    build: .
    profiles: ["training"]
    command: ["python", "-m", "src.pipelines.training_pipeline", "--config", "config/demo.yaml"]
    depends_on:
      - mlflow
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./config:/app/config
