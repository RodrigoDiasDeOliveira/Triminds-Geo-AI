# =============================================
# Satellite Land Classification - Configuration
# =============================================

project:
  name: "satellite-land-classification"
  version: "0.1.0"
  description: "Land use and crop classification using satellite imagery"
  random_seed: 42

# ==========================
# Data Configuration
# ==========================
data:
  root_dir: "data"
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  num_classes: 10                    # Ajuste conforme seu dataset
  image_size: [224, 224]             # Height, Width
  bands: [1, 2, 3, 4]                # Ex: RGB + NIR (ajuste conforme suas imagens)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# ==========================
# Training Configuration
# ==========================
training:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  early_stopping_patience: 8
  mixed_precision: true               # FP16 (torch.amp)

optimizer:
  name: "AdamW"
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 50

# ==========================
# Model Configuration
# ==========================
model:
  name: "hybrid"                      # Options: cnn, vit, hybrid
  backbone: "efficientnet_b0"         # ou resnet50, vit_base_patch16_224, etc.
  pretrained: true
  dropout: 0.3
  freeze_backbone: false

# ==========================
# Augmentation
# ==========================
augmentation:
  enabled: true
  rotation: 30
  horizontal_flip: true
  vertical_flip: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2

# ==========================
# Evaluation
# ==========================
evaluation:
  metrics: ["accuracy", "f1_score", "precision", "recall"]
  confusion_matrix: true

# ==========================
# GCP & Spark (Future)
# ==========================
gcp:
  project_id: "seu-project-id"
  region: "us-central1"
  bucket: "gs://seu-bucket-name"
  
dataproc:
  cluster_name: "satellite-spark-cluster"
  num_workers: 4
  
vertex_ai:
  training_job_name: "satellite-training"
  machine_type: "n1-standard-8"
  accelerator: "NVIDIA_TESLA_T4"

# ==========================
# Paths & Logging
# ==========================
paths:
  models_dir: "models"
  experiments_dir: "experiments"
  logs_dir: "logs"

logging:
  level: "INFO"
  save_experiment: true
  use_mlflow: false                    # Ativar quando implementar MLflow