# =============================================
# Triminds Geo AI - Configuration File
# Enterprise Modular Geospatial Intelligence Platform
# =============================================

project:
  name: "Triminds Geo AI"
  version: "0.2.0"
  description: "Plataforma de Inteligência Geoespacial com suporte multi-fonte (Google Embedding, Sentinel, etc.)"
  random_seed: 42
  author: "Rodrigo Dias"

# ==========================
# Source Configuration (Nova - Central)
# ==========================
source:
  type: "embedding"                    # opções: "embedding", "raster", "multispectral"
  provider: "google_embedding"         # opções: "google_embedding", "sentinel2", "planet", etc.
  config:
    bucket_name: "triminds-datasets"
    project_id: "${GCP_PROJECT_ID}"

# ==========================
# Data Configuration
# ==========================
data:
  root_dir: "gs://triminds-datasets/embeddings"   # caminho dos tiles (local ou GCS)
  year: 2023                                      # ano específico para embeddings anuais
  patch_size: 256
  image_size: [224, 224]
  channels: 64                                    # 64 para Google Satellite Embedding
  num_classes: 10
  normalize: true
  dataloader:
    batch_size: 32
    num_workers: 4
    shuffle: true
    pin_memory: true
    drop_last: true

# ==========================
# Dataset Metadata
# ==========================
dataset:
  name: "GoogleSatelliteEmbeddingV1"
  classes:
    - AnnualCrop
    - Forest
    - HerbaceousVegetation
    - Highway
    - Industrial
    - Pasture
    - PermanentCrop
    - Residential
    - River
    - SeaLake
  preprocessing:
    normalize: true
    augmentation: true

# ==========================
# Model Configuration
# ==========================
model:
  name: "resnet50"               # opções: resnet50, efficientnet, vit, swin, hybrid
  backbone: "efficientnet_b0"
  pretrained: true
  use_adapter: true              # Ativa EmbeddingAdapter para 64 canais
  adapter_out_channels: 64
  in_channels: 64
  dropout: 0.3
  freeze_backbone: false

# ==========================
# Training Configuration
# ==========================
training:
  num_epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.0001
  batch_size: 32
  num_workers: 4
  early_stopping_patience: 8
  mixed_precision: true
  accumulation_steps: 1
  gradient_clip_val: 1.0

optimizer:
  name: "AdamW"
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 50

# ==========================
# Augmentation
# ==========================
augmentation:
  enabled: true
  rotation: 30
  horizontal_flip: true
  vertical_flip: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  random_crop: true

# ==========================
# Evaluation
# ==========================
evaluation:
  metrics: ["accuracy", "f1_score", "precision", "recall", "kappa"]
  confusion_matrix: true
  per_class_metrics: true
  top_k: 5

# ==========================
# Export / Ingestion
# ==========================
export:
  scale: 10
  max_pixels: 10000000000
  region: [-46.8, -23.7, -46.5, -23.4]   # Exemplo: região de SP (ajuste conforme necessário)

# ==========================
# GCP & Cloud Configuration
# ==========================
gcp:
  project_id: "${GCP_PROJECT_ID}"
  region: "us-central1"
  bucket: "gs://triminds-datasets"
  
dataproc:
  cluster_name: "triminds-spark-cluster"
  num_workers: 4
  
vertex_ai:
  training_job_name: "triminds-training-job"
  machine_type: "n1-standard-8"
  accelerator: "NVIDIA_TESLA_T4"

# ==========================
# Vector Store (Futuro)
# ==========================
vectorstore:
  type: "pgvector"                     # ou "qdrant", "milvus"
  connection_string: "postgresql://user:password@localhost:5432/triminds"
  table_name: "geo_features"

# ==========================
# Paths & Logging
# ==========================
paths:
  models_dir: "models"
  experiments_dir: "experiments"
  logs_dir: "logs"
  embeddings_dir: "gs://triminds-datasets/embeddings"
  metadata_dir: "metadata"

logging:
  level: "INFO"
  save_experiment: true
  use_mlflow: true
  mlflow_tracking_uri: "http://localhost:5000"   # ou seu servidor MLflow

# ==========================
# Experiment Tracking
# ==========================
experiment:
  name: "google-embedding-baseline"
  tags:
    - embedding
    - google
    - resnet50